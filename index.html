<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>歴史カードバトル</title>
<link rel="stylesheet" href="src/style.css?v=202611222302">
</head>
<body>
<canvas id="bgfx"></canvas>
<div id="stage" class="land">

  <!-- はじめのタップ（音を出すために必要） -->
  <section id="boot" class="screen">
    <div class="boot-in">
      <div class="boot-ring"></div>
      <div class="boot-msg">画面をタップしてください</div>
      <div class="boot-sub">音が出ます</div>
    </div>
  </section>

  <!-- タイトル・メニュー -->
  <section id="title" class="screen">
    <div class="tt-view"><div class="tt-img"></div></div>
    <div class="tt-shade"></div>
    <div class="tt-petals" id="petals"></div>
    <div class="tt-white"></div>
    <div class="tt-logo"></div>
    <div class="tt-press">画面をタップしてスタート</div>
    <div class="tt-menu">
      <div class="hud" id="menuHud"></div>
      <div class="mm-list">
        <button class="mm gold" data-act="toDeck"><i class="mm-ic" data-ico="battle"></i><div class="mm-t"><b>ひとりでバトル</b><span>CPU対戦・時代めぐり・歴史パズル</span></div></button>
        <button class="mm blue" data-act="modeFriend"><i class="mm-ic" data-ico="friends"></i><div class="mm-t"><b>友達とバトル</b><span>2台で音を使って対戦</span></div></button>
        <button class="mm " data-act="shop"><i class="mm-ic" data-ico="shop"></i><div class="mm-t"><b>ショップ</b><span>デッキを手に入れる</span></div></button>
        <button class="mm " data-act="zukan"><i class="mm-ic" data-ico="book"></i><div class="mm-t"><b>カード図鑑</b><span>集めたカードを見る</span></div></button>
        <button class="mm " data-act="howto"><i class="mm-ic" data-ico="help"></i><div class="mm-t"><b>あそびかた</b><span>ルールを読む</span></div></button>
        <button class="mm " data-act="settings"><i class="mm-ic" data-ico="gear"></i><div class="mm-t"><b>設定</b><span>音・表示・名前・背景</span></div></button>
      </div>
    </div>
    <div class="title-foot">テスト版 v0.6　K.nom</div>
  </section>

  <!-- 最初のデッキ -->
  <section id="starter" class="screen">
    <div class="title-bg dim"></div>
    <div class="st-head">最初のデッキをえらぼう</div>
    <div class="st-sub">1つを無料で手に入れられる。ほかのデッキはショップで買える</div>
    <div class="st-list" id="starterList"></div>
  </section>

  <!-- ショップ -->
  <section id="shop" class="screen">
    <div class="title-bg dim"></div>
    <div class="sp-head panel" id="shopHead"></div>
    <div class="sp-grid" id="shopGrid"></div>
  </section>

  <!-- デッキえらび -->
  <section id="deck" class="screen">
    <div class="title-bg dim"></div>
    <div class="deck-head">デッキをえらぶ</div>
    <div class="deck-list" id="deckList"></div>
    <div class="deck-foot">
            <button class="btn" data-act="shop" data-ico="shop">ショップ</button>
    </div>
  </section>

  <!-- カード図鑑：デッキの一覧 -->
  <section id="camp" class="screen">
    <div class="title-bg dim"></div>
    <div class="deck-head">時代めぐり</div>
    <div class="cp-list" id="campList"></div>
    <div class="deck-foot"></div>
  </section>
  <section id="puzzle" class="screen">
    <div class="title-bg dim"></div>
    <div class="deck-head">歴史パズル</div>
    <div class="pz-list" id="pzList"></div>
    <div class="deck-foot pz-foot"><button class="btn" id="pzPrev" data-ico="back">まえへ</button><span class="pgno" id="pzPage"></span><button class="btn" id="pzNext" data-ico="next">つぎへ</button></div>
  </section>
  <section id="friend" class="screen">
    <div class="title-bg dim"></div>
    <div class="deck-head">友達とバトル</div>
    <div class="fr-body" id="frBody"></div>
  </section>
  <section id="zlist" class="screen">
    <div class="title-bg dim"></div>
    <div class="deck-head">カード図鑑</div>
    <div class="deck-list" id="zlistList"></div>
    <div class="deck-foot">
            <button class="btn" data-act="shop" data-ico="shop">ショップ</button>
    </div>
  </section>

  <!-- カード図鑑：カード -->
  <section id="zukan" class="screen">
    <div class="title-bg dim"></div>
    <div id="zkTop" class="panel"></div>
    <div id="zkGrid"></div>
    <div id="zkInfo" class="panel"></div>
  </section>

  <!-- 対戦 -->
  <section id="game" class="screen">
    <div class="game-bg"></div>
    <div id="oppBar" class="panel"></div>
    <div id="turnBox" class="panel"></div>
    <div id="board"></div>
    <div id="detail" class="panel"></div>
    <div id="ctrl"></div>
    <div id="hand"></div>
  </section>

  <button id="backBtn" class="btn" data-ico="back">もどる</button>
  <div id="fx"></div>
  <div id="modal"></div>
</div>

<script src="lib/se.js?v=202611222302"></script>
<script src="src/data.js?v=202611222302"></script>
<script src="src/engine.js?v=202611222302"></script>
<script src="lib/gsap.min.js?v=202611222302"></script>
<script src="lib/pixi.min.js?v=202611222302"></script>
<script src="lib/pixi-filters.js?v=202611222302"></script>
<script src="src/fx.js?v=202611222302"></script>
<script src="src/icons.js?v=202611222302"></script>
<script src="src/ui.js?v=202611222302"></script>
<script src="src/meta.js?v=202611222302"></script>
<script src="src/tutorial.js?v=202611222302"></script>
<script src="src/lines.js?v=202611222302"></script>
<script src="src/howto.js?v=202611222302"></script>
<script src="src/camp.js?v=202611222302"></script>
<script src="src/puzzles.js?v=202611222302"></script>
<script src="src/puzzle.js?v=202611222302"></script>
<script src="lib/ggwave.js?v=202611222302"></script>
<script src="lib/jsQR.min.js?v=202611222302"></script>
<script src="lib/qrcode.min.js?v=202611222302"></script>
<script src="src/friend.js?v=202611222302"></script>
</body>
</html>
