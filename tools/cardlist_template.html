<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>歴史カードバトル カードリスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0a16;color:#f3ecdc;font-family:'Yu Gothic','Meiryo','Hiragino Sans',sans-serif;font-weight:700}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#171230,#0c0a16);border-bottom:1px solid rgba(232,195,106,.5);padding:10px 12px}
h1{font-size:18px;color:#e8c36a;letter-spacing:.1em;margin-bottom:8px}
#tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#1a1530;cursor:pointer;color:#b9b0c9;font-size:10px;height:68px}
.tab img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center 15%;border:2px solid #444}
.tab span{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tab.on{border-color:#e8c36a;color:#fff;background:#2a2148}.tab.on img{border-color:#e8c36a}
main{padding:14px 12px 40px;max-width:1280px;margin:0 auto}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.dh img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:center 15%;border:3px solid #e8c36a}
.dh .n{font-size:26px;font-weight:900}.dh .s{font-size:14px;color:#e8c36a}.dh .d{font-size:13px;color:#b9b0c9}
.wr{margin-left:auto;text-align:right;font-size:12px;color:#b9b0c9}.wr b{display:block;font-size:24px;color:#fff1c4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cd{display:flex;gap:10px;padding:10px;border-radius:10px;background:#16122a;border:1px solid rgba(232,195,106,.35);min-height:150px}
.ph{position:relative;flex:none;width:128px;height:95px;border-radius:6px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 2px #d4a94e}
.ph.face{background-position:center 18%}
.cost,.pow{position:absolute;top:-5px;width:26px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.cost{left:-5px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(180deg,#8fd0ff,#2a6fd0 55%,#163b80)}
.pow{right:-5px;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:linear-gradient(180deg,#ffd27a,#e07b22 55%,#8d3c0c)}
.tx{flex:1;min-width:0}
.nm{font-size:16px;color:#fff1c4;margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.meta i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.1)}
.k-reveal{background:#7a4bd1!important}.k-ongoing{background:#2c8a6a!important}.k-prophecy{background:#b13a8a!important}.k-combo{background:#c48b25!important;color:#2a1b05}.k-none{background:#4b4560!important}
.sh{background:#5a4a1a!important;color:#ffe7a3}
.ef{font-size:13px;line-height:1.5;margin-bottom:4px}
.mm{font-size:12px;line-height:1.5;color:#c9bfa8;border-top:1px dashed rgba(232,195,106,.3);padding-top:4px}
.wr{white-space:nowrap;flex:none}
@media (max-width:600px){header{position:static}.dh .n{font-size:20px}.dh img{width:56px;height:56px}.tab{height:62px}.tab img{width:36px;height:36px}}
.note{font-size:12px;color:#b9b0c9;margin:14px 0 0;line-height:1.6}
</style></head><body>
<header><h1>歴史カードバトル カードリスト（v0.4案）</h1><div id="tabs"></div></header>
<main id="main"></main>
<script>
/*DATA*/
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function show(i){
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));
  const d=DECKS[i];
  document.getElementById('main').innerHTML=`<div class="dh"><img src="${d.face}"><div><div class="n">${esc(d.name)}</div><div class="s">${esc(d.era)}時代・テーマ「${esc(d.theme)}」</div><div class="d">${esc(d.desc)}</div></div>
    ${d.win?`<div class="wr">CPUどうしの勝率<b>${d.win}%</b></div>`:''}</div>
    <div class="grid">${d.cards.map(c=>`<div class="cd"><div class="ph${c.face?' face':''}" style="background-image:url(${c.i})"><div class="cost">${c.c}</div><div class="pow">${c.p}</div></div>
    <div class="tx"><div class="nm">${esc(c.n)}</div><div class="meta"><i class="k-${c.k}">${c.kw}</i>${c.t.split('・').map(t=>`<i>${t}</i>`).join('')}${c.share?'<i class="sh">共通カード</i>':''}</div>
    ${c.x?`<div class="ef">${esc(c.x)}</div>`:''}<div class="mm">${esc(c.m)}</div></div></div>`).join('')}</div>
    <p class="note">左上の青い数字がコスト、右上のオレンジの数字がパワー。「共通カード」は、ほかのデッキにも入っていて、どのデッキでも同じ数値・同じ効果。</p>`;
  window.scrollTo(0,0);
}
document.getElementById('tabs').innerHTML=DECKS.map((d,i)=>`<div class="tab" onclick="show(${i})"><img src="${d.face}"><span>${esc(d.name.split('・')[0])}</span></div>`).join('');
show(0);
</script></body></html>
